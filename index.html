<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Application indisponible</title>
<style>
  :root { --bg: #f2f4f9; --card: #ffffff; --fg: #141a2e; --muted: #5d6680; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0d1018; --card: #161a25; --fg: #eceef5; --muted: #a0a8bd; color-scheme: dark; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
  main { background: var(--card); border-radius: 16px; padding: 28px 24px; max-width: 420px; text-align: center; box-shadow: 0 6px 18px rgba(0,0,0,.08); }
  h1 { font-size: 21px; margin: 0 0 8px; }
  p { margin: 0; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Cette application n'est plus disponible</h1>
  <p>Elle a été retirée par son auteur. Tu peux supprimer son icône de ton écran d'accueil.</p>
</main>
<script>
  // Ferme l'ancienne version installée : retire son service worker et son cache hors connexion.
  // Ne touche à aucune autre donnée du téléphone.
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.getRegistrations().then(function (regs) {
      regs.forEach(function (r) { if (r.scope.indexOf("/frigofiche-/") !== -1) r.unregister(); });
    }).catch(function () {});
  }
  if (window.caches) caches.keys().then(function (keys) {
    keys.forEach(function (k) { if (k.indexOf("frigofiche-v") === 0) caches.delete(k); });
  }).catch(function () {});
</script>
</body>
</html>
